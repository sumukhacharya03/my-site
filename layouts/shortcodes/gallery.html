{{- /* Same four photos as before. Each is shown at its own aspect ratio
       rather than cropped into a fixed letterbox, and resized by Hugo so it
       stays sharp. */ -}}
<div class="gallery">
    {{- range (seq 4) }}
    <figure class="gallery__item">
        {{ partial "img.html" (dict
            "path"  (printf "images/photo%d.jpg" .)
            "alt"   (printf "Photo %d" .)
            "w"     640) }}
    </figure>
    {{- end }}
</div>
