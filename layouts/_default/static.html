{{ define "main" }}
<div class="shell">
    <header class="page-head">
        <h1 class="page-head__title">{{ .Title }}</h1>
        {{- with .Params.description }}
        <p class="page-head__lead">{{ . }}</p>
        {{- end }}
    </header>

    <div class="prose" style="max-width: none;">
        {{ .Content }}
    </div>
</div>
{{ end }}
